<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Login System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Moul&family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kantumruy Pro', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #bfe3f8; /* ពណ៌ផ្ទៃខាងក្រោយខៀវស្រទន់ដូចរូបដើម */
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        .logo-icon {
            font-size: 38px;
            color: #2563eb;
            margin-bottom: 8px;
        }
        .login-card h2 { 
            font-family: 'Moul', serif;
            font-size: 15px;
            color: #1a5276; 
            margin-bottom: 6px; 
        }
        .sub-tel {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .system-title {
            font-family: 'Moul', serif;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .input-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: #333; 
            font-weight: bold; 
        }
        .input-group input { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: 'Kantumruy Pro', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-family: 'Moul', serif;
            font-size: 13px; 
            cursor: pointer; 
            transition: background-color 0.2s;
            margin-top: 5px;
        }
        button:hover { 
            background-color: #1d4ed8; 
        }
        #message { 
            margin-top: 15px; 
            font-size: 13px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

  <div class="login-card">
    <div class="logo-icon">🏛️</div>
    <h2>ប្រព័ន្ធបែងចែកកាលវិភាគ</h2>
    <div class="sub-tel">Tel: 098981192 / 0973272123</div>
    <div class="system-title">School Login</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">អ៊ីមែល (Email)</label>
        <input type="email" id="email" required placeholder="👤 example@school.edu">
      </div>
      <div class="input-group">
        <label for="password">ពាក្យសម្ងាត់ (Password)</label>
        <input type="password" id="password" required placeholder="🔒 password">
      </div>
      <button type="submit" id="btnLogin">ចូលប្រើប្រាស់</button>
    </form>
    <div id="message"></div>
  </div>

  <!-- Firebase App & Authentication SDKs (Modular Script via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6sPqsdVZ9pFerzOj5Kz2pX-MVsdwGKzY",
      authDomain: "school-login-system-378d1.firebaseapp.com",
      projectId: "school-login-system-378d1",
      storageBucket: "school-login-system-378d1.firebasestorage.app",
      messagingSenderId: "1014509963808",
      appId: "1:1014509963808:web:362a6b20144033a267ca45",
      measurementId: "G-EFBHN1D85M"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      messageDiv.style.color = '#2563eb';
      messageDiv.innerText = "កំពុងផ្ទៀងផ្ទាត់...";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;

          // --- 🔒 ប្រព័ន្ធទប់ស្កាត់មិនឱ្យ Login លើសពី ១ ម៉ាស៊ីន ---
          // ពិនិត្យមើលថាតើ Email នេះ មាន Active នៅលើ Browser ផ្សេងរួចហើយឬยัง (តាមរយៈ localStorage)
          const activeSessionDevice = localStorage.getItem("active_device_" + user.email);
          const currentBrowserSession = sessionStorage.getItem("current_browser_token");

          // បើបង្កើត Token ប្រចាំ Browser នេះមិនទាន់មាន គឺបង្កើតថ្មីមួយ
          let browserToken = currentBrowserSession;
          if (!browserToken) {
            browserToken = 'dev_' + Math.random().toString(36).substring(2) + Date.now();
            sessionStorage.setItem("current_browser_token", browserToken);
          }

          // បើមានម៉ាស៊ីនផ្សេងទៀតធ្លាប់ Login ទុក ហើយ Token មិនមែនជាម៉ាស៊ីនបច្ចុប្បន្ន 
          // (អាចទាមទារឱ្យបិទម៉ាស៊ីនមុន ឬបដិសេធមិនឱ្យចូល)
          // ទីនេះយើងកំណត់ថា បើមានម៉ាស៊ីនផ្សេងបើកอยู่ វានឹងតម្រូវឱ្យ Logout ម៉ាស៊ីនចាស់ ឬបដិសេធ
          if (activeSessionDevice && activeSessionDevice !== browserToken) {
            // ពិនិត្យបន្ថែម៖ បើចង់ឱ្យវា Force Login ថ្មី និងទាត់ម៉ាស៊ីនចាស់ចោល អាចរំលងកូដនេះបាន
            // ប៉ុន្តែបើចង់ "បដិសេធ" មិនឱ្យ Login ព្រោះកំពុងបើកលើកុំព្យូទ័រផ្សេង៖
            messageDiv.style.color = '#dc2626';
            messageDiv.innerText = "⚠️ បរាជ័យ៖ គណនីនេះកំពុងត្រូវបានបើកប្រើប្រាស់នៅលើកុំព្យូទ័រផ្សេងរួចហើយ!";
            signOut(auth); // Sign out វិញភ្លាម
            return;
          }

          // រក្សាទុកសិទ្ធិម៉ាស៊ីននេះថាជាម៉ាស៊ីនតែមួយគត់ដែលកំពុង Active
          localStorage.setItem("active_device_" + user.email, browserToken);
          sessionStorage.setItem("currentUser", user.email);
          // ----------------------------------------------------

          messageDiv.style.color = '#16a34a';
          messageDiv.innerText = "ចូលប្រព័ន្ធជោគជ័យ! កំពុងចូលទៅកាន់ប្រព័ន្ធ...";
          
          setTimeout(() => {
            window.location.href = "app.html";
          }, 1000);
        })
        .catch((error) => {
          messageDiv.style.color = '#dc2626';
          messageDiv.innerText = "បរាជ័យ៖ អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវឡើយ។";
        });
    });
  </script>
</body>
</html>
