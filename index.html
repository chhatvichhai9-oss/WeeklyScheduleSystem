<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Login System</title>
    <!-- 🖼️ កូដទូទៅសម្រាប់ Tab និង Browser Favicon -->
    <link rel="icon" type="image/png" sizes="16x16" href="logo1.png">
    <link rel="icon" type="image/png" sizes="32x32" href="logo2.png">
    <link rel="icon" type="image/png" sizes="96x96" href="logo4.png">
    <!-- Favicon ទូទៅសម្រាប់ Browser Tab -->
    <link rel="icon" type="image/png" sizes="16x16" href="path-to-your-logo/logo1.png">
    <link rel="icon" type="image/png" sizes="32x32" href="path-to-your-logo/logo2.png">
    <!-- សម្រាប់ Android Chrome (ដាក់រូបទំហំធំល្មម ដូចជា 192x192 ឬ 512x512) -->
    <link rel="icon" sizes="512x512" href="path-to-your-logo/logo.png">
    <!link rel="icon" sizes="192x192" href="path-to-your-logo/logo3.png">
    <!-- សម្រាប់ Android Chrome & Mobile Browser -->
    <link rel="manifest" href="/site.webmanifest">
    <!-- Android & Windows Shortcut Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="logo3.png">
    <link rel="icon" type="image/png" sizes="512x512" href="logo.png">    
    <!-- កំណត់ពណ៌របារខាងលើ (Address Bar) របស់ Chrome លើ Android -->
    <meta name="theme-color" content="#ffffff">
    <!-- កូដសម្រាប់ដាក់ Favicon/Logo តូច -->
    <link rel="icon" type="image/png" href="path-to-your-logo/logo1.png">
    <!-- សម្រាប់ Apple / iOS devices (ជម្រើសបន្ថែម) -->
    <link rel="apple-touch-icon" href="path-to-your-logo/logo1.png">
    <!-- 🍎 សម្រាប់ Apple និង Windows Shortcut Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <meta name="msapplication-TileImage" content="logo.png">
    <meta name="msapplication-TileColor" content="#2563eb">
    <!-- 📱 ភ្ជាប់ Manifest -->
    <link rel="manifest" href="manifest.json">    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Moul&family=Kantumruy+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Kantumruy Pro', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #bfe3f8; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        .logo-icon {
            font-size: 38px;
            color: #2563eb;
            margin-bottom: 8px;
        }
        .login-card h2 { 
            font-family: 'Moul', serif;
            font-size: 15px;
            color: #1a5276; 
            margin-bottom: 6px; 
        }
        .sub-tel {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .system-title {
            font-family: 'Moul', serif;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .input-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 13px; 
            color: #333; 
            font-weight: bold; 
        }
        .input-group input { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: 'Kantumruy Pro', sans-serif;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-family: 'Moul', serif;
            font-size: 13px; 
            cursor: pointer; 
            transition: background-color 0.2s;
            margin-top: 5px;
        }
        button:hover { 
            background-color: #1d4ed8; 
        }
        #message { 
            margin-top: 15px; 
            font-size: 13px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

  <div class="login-card">
    <!-- 🖼️ ដាក់រូបឡូកូក្រសួងអប់រំជំនួសកូដ SVG ដើម -->
    <img src="logo.png" alt="ឡូកូក្រសួងអប់រំ" style="width: 80px; height: auto; margin-bottom: 10px;">
    <h2 style="color: #f00606; font-size: 20px;">ប្រព័ន្ធបែងចែកកាលវិភាគ</h2>
    <div class="sub-tel"style="color: #f30505; font-family: 'Khmer OS Muol Light';">Tel: <span style="color: #0b22b8; font-family: 'Khmer OS Muol Light';"> 098981192 / 0973272123</span></div>
    <div class="system-title" style="color: #f41c1c;">School Login</div>

    <form id="loginForm">
      <div class="input-group">
        <label for="email">អ៊ីមែលសាលា (Email school)</label>
        <input type="email" id="email" required placeholder="👤 example@school.com">
      </div>
      <div class="input-group">
        <label for="password">ពាក្យសម្ងាត់ (Password)</label>
        <input type="password" id="password" required placeholder="🔒 password">
      </div>
      <button type="submit" id="btnLogin">ចូលប្រើប្រាស់</button>
    </form>
    <div id="message"></div>
  </div>

  <!-- Firebase App, Auth & Firestore SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6sPqsdVZ9pFerzOj5Kz2pX-MVsdwGKzY",
      authDomain: "school-login-system-378d1.firebaseapp.com",
      projectId: "school-login-system-378d1",
      storageBucket: "school-login-system-378d1.firebasestorage.app",
      messagingSenderId: "1014509963808",
      appId: "1:1014509963808:web:362a6b20144033a267ca45",
      measurementId: "G-EFBHN1D85M"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    // ប្រើប្រាស់ localStorage ថេរសម្រាប់ Device ID ដើម្បីកុំឱ្យវាប្តូរលេខរៀងរាល់ពេល Login ឡើងវិញ
    let deviceId = localStorage.getItem("my_permanent_device_id");
    if (!deviceId) {
      deviceId = 'pc_dev_' + Math.random().toString(36).substring(2) + Date.now();
      localStorage.setItem("my_permanent_device_id", deviceId);
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      messageDiv.style.color = '#2563eb';
      messageDiv.innerText = "កំពុងផ្ទៀងផ្ទាត់...";

      try {
        // ១. ផ្ទៀងផ្ទាត់ Login ជាមួយ Firebase Auth
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // ២. ពិនិត្យស្ថានភាពនៅក្នុង Cloud Firestore Database
        const safeEmailKey = email.replace(/[.#$[\]]/g, "_");
        const sessionRef = doc(db, "active_sessions", safeEmailKey);
        const sessionSnap = await getDoc(sessionRef);

        const currentTime = Date.now();
        const timeoutLimit = 3 * 60 * 1000; // កំណត់ត្រឹម ៣ នាទី (បើគ្មាន Heartbeat ពីម៉ាស៊ីនចាស់ ចាត់ទុកថាឈប់ប្រើ)

        if (sessionSnap.exists()) {
          const sessionData = sessionSnap.data();
          
          // បើជា Device ផ្សេង ហើយម៉ាស៊ីនចាស់នៅមានសកម្មភាព (Active ក្នុងអំឡុងពេលកំណត់) គឺប្លុកចោល
          if (sessionData.deviceId !== deviceId && (currentTime - sessionData.lastActive < timeoutLimit)) {
            messageDiv.style.color = '#dc2626';
            messageDiv.innerText = "⚠️ បរាជ័យ៖ គណនីនេះកំពុងត្រូវបានបើកប្រើប្រាស់នៅលើឧបករណ៍ផ្សេងរួចហើយ!";
            await signOut(auth); // បដិសេធមិនឱ្យចូល
            return;
          }
        }

        // ៣. បើកចូលបាន ធ្វើការកត់ត្រា Device ID នេះចូល Cloud Database
        await setDoc(sessionRef, {
          deviceId: deviceId,
          lastActive: currentTime
        });

        messageDiv.style.color = '#16a34a';
        messageDiv.innerText = "ចូលប្រព័ន្ធជោគជ័យ! កំពុងចូលទៅកាន់ប្រព័ន្ធ...";
        
        sessionStorage.setItem("currentUser", user.email);
        // ➕ បន្ថែមបន្ទាត់នេះ ដើម្បីកំណត់សិទ្ធិឱ្យទំព័រ app.html ស្គាល់ថាបាន Login រួច
        localStorage.setItem("isLoggedIn", "true");

        setTimeout(() => {
          window.location.href = "app.html";
        }, 1000);

      } catch (error) {
        messageDiv.style.color = '#dc2626';
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          messageDiv.innerText = "បរាជ័យ៖ អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវឡើយ។";
        } else {
          messageDiv.innerText = "បរាជ័យ៖ " + error.message;
        }
      }
    });
  </script>
</body>
</html>
