<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Login System</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; }
    .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
    .login-card h2 { margin-bottom: 20px; color: #333; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #1557b0; }
    #message { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>ចូលប្រព័ន្ធ (Login)</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="email">អ៊ីមែល</label>
        <input type="email" id="email" required placeholder="example@school.edu">
      </div>
      <div class="input-group">
        <label for="password">ពាក្យសម្ងាត់</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" id="btnLogin">ចូលប្រើប្រាស់</button>
    </form>
    <div id="message"></div>
  </div>

  <!-- Firebase App & Authentication SDKs (Modular Script via CDN) -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB6sPqsdVZ9pFerzOj5Kz2pX-MVsdwGKzY",
      authDomain: "school-login-system-378d1.firebaseapp.com",
      projectId: "school-login-system-378d1",
      storageBucket: "school-login-system-378d1.firebasestorage.app",
      messagingSenderId: "1014509963808",
      appId: "1:1014509963808:web:362a6b20144033a267ca45",
      measurementId: "G-EFBHN1D85M"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ដំណើរការបំពេញទម្រង់ Login
    const loginForm = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      messageDiv.style.color = 'blue';
      messageDiv.innerText = "កំពុងផ្ទៀងផ្ទាត់...";

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          messageDiv.style.color = 'green';
          messageDiv.innerText = "ចូលប្រព័ន្ធជោគជ័យ! ស្វាគមន៍ " + user.email;
          
          // បន្ទាប់ពី Login ជោគជ័យ ឱ្យវាលោតទៅកាន់ទំព័រ app.html របស់អ្នក
          setTimeout(() => {
            window.location.href = "app.html";
          }, 1000);
        })
        .catch((error) => {
          messageDiv.style.color = 'red';
          messageDiv.innerText = "បរាជ័យ៖ " + error.message;
        });
    });
  </script>
</body>
</html>
