<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងកាលវិភាគសិក្សា - Sign In</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            /* ផ្ទាំង Background ពណ៌ខៀវ និងលាយជម្រាលស្អាត */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h2 {
            color: #333333;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .info-box {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: #666;
        }

        .remember-forgot a {
            color: #2196F3;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .btn-signin {
            background-color: #2e7d32;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 12px;
        }

        .btn-signin:hover {
            background-color: #1b5e20;
        }

        .btn-create {
            background-color: #1976d2;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-create:hover {
            background-color: #0d47a1;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">🎓</div>
        <h2>ប្រព័ន្ធគ្រប់គ្រងកាលវិភាគសិក្សា</h2>
        <p class="subtitle">ចូលទៅកាន់គណនីរបស់អ្នក</p>

        <div class="info-box">
            <span>ℹ️</span>
            <span>លោកគ្រូអ្នកគ្រូត្រូវការយកទៅប្រើអាចទាក់ទងតាមលេខ 098 98 11 92.</span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Email ឧ.vichhaichhat9@gmail.com" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-signin">Sign In</button>
            <button type="button" class="btn-create" onclick="alert('មុខងារបង្កើត Account កំពុងអភិវឌ្ឍន៍!')">Create account</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // គំរូគណនីងាយៗសម្រាប់តេស្ត (Admin / 123456)
            if (user === "admin" && pass === "123456") {
                // កំណត់សិទ្ធិថាបានចូលហើយ
                localStorage.setItem("isLoggedIn", "true");
                
                // បញ្ជូនទៅកាន់ទំព័រកម្មវិធីខាងក្នុង (app.html)
                window.location.href = "app.html";
            } else {
                alert("Email ឬ Password មិនត្រឹមត្រូវទេ!");
            }
        });
    </script>
</body>
</html>
