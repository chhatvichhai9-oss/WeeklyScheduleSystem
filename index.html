<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Login Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #38bdf8 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            z-index: 10;
            margin: 20px;
        }

        .school-header {
            margin-bottom: 20px;
        }

        .container h2 {
            color: #1e3a8a;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #2563eb;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .input-group::before {
            font-family: sans-serif;
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 18px;
        }

        .input-group.user::before {
            content: "👤";
        }

        .input-group.pass::before {
            content: "🔒";
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
            color: #64748b;
        }

        .remember-forgot a {
            color: #2563eb;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-signin:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="school-header">
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3"/>
            </svg>
            <h2>ប្រព័ន្ធបែងចែកកាលវិភាគ</h2>
            <h3 style="font-size: 14px; color: #64748b; margin-bottom: 10px;">Tel: 098981192 / 0973272123</h3>
            <h2>School Login</h2>
        </div>

        <form id="loginForm">
            <div class="input-group user">
                <input type="text" id="username" placeholder="Full Name or Username" required>
            </div>
            <div class="input-group pass">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-signin">Submit</button>
        </form>
    </div>

    <script>
        // កំណត់បញ្ជីគណនី (អ្នកអាចបន្ថែមឈ្មោះ និងលេខសម្ងាត់ផ្សេងៗនៅទីនេះបានតាមតម្រូវការ)
        const validUsers = [
            { username: "admin", password: "123" },
            { username: "teacher1", password: "456" },
            { username: "teacher2", password: "789" }
        ];

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const inputUser = document.getElementById('username').value.trim();
            const inputPass = document.getElementById('password').value.trim();

            // ពិនិត្យមើលថាតើ Username និង Password ត្រូវនឹងគណនីណាមួយក្នុងបញ្ជីដែរឬទេ
            const matchedUser = validUsers.find(u => u.username === inputUser && u.password === inputPass);

            if (matchedUser) {
                // ពិនិត្យមើលថាតើគណនីនេះកំពុងត្រូវបាន Login រួចហើយឬនៅលើ Tab ឬ Device ផ្សេង
                const activeSession = localStorage.getItem("active_user_" + matchedUser.username);
                
                if (activeSession) {
                    alert("គណនីនេះកំពុងត្រូវបានប្រើប្រាស់ដោយអ្នកផ្សេងរួចហើយ! មិនអាចចូលប្រើបានទេ។ សូមទាក់ទងតាមលេខទូរស័ព្ទ 098981192 / 0973272123 ដើម្បីទទួលបានជំនួយ សូមអរគុណ។");
                    return;
                }

                // កត់ត្រាថា គណនីនេះកំពុងប្រើប្រាស់
                localStorage.setItem("active_user_" + matchedUser.username, "true");
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("currentUser", matchedUser.username);

                // បញ្ជូនទៅកាន់ទំព័រគោលដៅ (កម្មវិធីកាលវិភាគរបស់អ្នក)
                window.location.href = "app.html";
            } else {
                alert("ឈ្មោះ ឬ Password មិនត្រឹមត្រូវទេ!");
            }
        });
    </script>
</body>
</html>
